name: release checks
on:
  push:
    branches: [main, "release/**", "feature/**"]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:11.8.6
        env:
          MARIADB_ROOT_PASSWORD: ci-only-ephemeral-password
          MARIADB_DATABASE: sisat_test_v1
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
        env:
          TEST_DATABASE_URL: mariadb://root:ci-only-ephemeral-password@127.0.0.1:3306/sisat_test_v1
      - run: npm run build
        env:
          DB_PASSWORD: CI_SERVER_ONLY_DB_SECRET_1_1
          DEMO_PASSWORD: CI_SERVER_ONLY_DEMO_SECRET_1_1
          SLIP_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      - run: npm run test:bundle
        env:
          DB_PASSWORD: CI_SERVER_ONLY_DB_SECRET_1_1
          DEMO_PASSWORD: CI_SERVER_ONLY_DEMO_SECRET_1_1
          SLIP_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:api
        env:
          RUN_BROWSER_TESTS: "1"
          TEST_DATABASE_URL: mariadb://root:ci-only-ephemeral-password@127.0.0.1:3306/sisat_test_v1
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run release:zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sisat90-hostatom-source
          path: |
            releases/*.zip
            releases/*.sha256
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: responsive-screenshots
          path: playwright-report/*.png
          if-no-files-found: ignore
          retention-days: 14
